
<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список задач</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f4f6f9;
            color: #243047;
        }
        .container { max-width: 1100px; margin: auto; }
        .panel {
            background: white;
            padding: 24px;
            margin-bottom: 20px;
            border-radius: 10px;
        }
        .button {
            display: inline-block;
            padding: 10px 14px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }
        .delete { background: #dc2626; }
        .secondary { background: #64748b; }
        input, select {
            padding: 9px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            margin: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        th, td {
            padding: 13px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }
        th { background: #eaf0f8; }
        .success { color: #15803d; }
        .error { color: #dc2626; }
        .actions { display: flex; gap: 7px; flex-wrap: wrap; }
        .inline-form { display: inline; }
        .status-done { color: #15803d; }
        .status-open { color: #b45309; }
    </style>
</head>
<body>
<div class="container">
    <h1>Список задач</h1>

    <p>
        <a class="button" th:href="@{/}">Главная</a>
        <a class="button" th:href="@{/task/new}">+ Новая задача</a>
    </p>

    <div class="panel">
        <p class="success"
           th:if="${successMessage}"
           th:text="${successMessage}"></p>

        <h2>Фильтрация задач</h2>

        <p class="error"
           th:if="${filterError}"
           th:text="${filterError}"></p>

        <form th:action="@{/tasks/filter}" method="get">
            <label for="completed">Статус:</label>

            <select id="completed" name="completed">
                <option value=""
                        th:selected="${selectedCompleted == null
                            or selectedCompleted == ''}">
                    Все задачи
                </option>
                <option value="false"
                        th:selected="${selectedCompleted == 'false'}">
                    Не выполнена
                </option>
                <option value="true"
                        th:selected="${selectedCompleted == 'true'}">
                    Выполнена
                </option>
            </select>

            <label for="startDate">С даты:</label>
            <input type="date" id="startDate" name="startDate"
                   th:value="${startDate}">

            <label for="endDate">По дату:</label>
            <input type="date" id="endDate" name="endDate"
                   th:value="${endDate}">

            <button class="button" type="submit">Фильтровать</button>
            <a class="button secondary" th:href="@{/tasks}">Сбросить</a>
        </form>
    </div>

    <div class="panel">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Описание</th>
                <th>Срок</th>
                <th>Статус</th>
                <th>Действия</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="task : ${tasks}">
                <td th:text="${task.id}"></td>
                <td th:text="${task.title}"></td>
                <td th:text="${task.description != null
                    and !task.description.isEmpty()
                    ? task.description : '—'}"></td>
                <td>
                  <span th:if="${task.dueDate != null}"
                        th:text="${#temporals.format(task.dueDate, 'dd.MM.yyyy')}">
                  </span>
                    <span th:unless="${task.dueDate != null}">Не указан</span>
                </td>
                <td>
                    <span th:if="${task.completed}"
                          class="status-done">Выполнена</span>
                    <span th:unless="${task.completed}"
                          class="status-open">Не выполнена</span>
                </td>

                <td>
                    <div class="actions">
                        <a class="button"
                           th:href="@{/tasks/edit/{id}(id=${task.id})}">
                            Изменить
                        </a>

                        <form class="inline-form"
                              th:action="@{/tasks/delete/{id}(id=${task.id})}"
                              method="post"
                              onsubmit="return confirm('Удалить задачу?');">
                            <button class="button delete" type="submit">
                                Удалить
                            </button>
                        </form>
                    </div>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(tasks)}">
                <td colspan="6">Задачи не найдены.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
