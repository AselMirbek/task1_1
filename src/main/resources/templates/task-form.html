
<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Задача</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #243047;
            margin: 30px;
        }
        .container {
            max-width: 650px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
        }
        label { display: block; margin: 18px 0 7px; }
        input[type="text"], textarea, input[type="date"] {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
        }
        textarea { min-height: 120px; resize: vertical; }
        .button {
            display: inline-block;
            padding: 11px 17px;
            margin-top: 20px;
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }
        .secondary { background: #64748b; }
        .error { color: #dc2626; font-size: 14px; }
        .checkbox { margin-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h1 th:text="${pageTitle}">Задача</h1>

    <form th:action="@{/task/save}"
          th:object="${taskModel}"
          method="post">
        <div class="error"
             th:if="${formError != null}"
             th:text="${formError}">
        </div>

        <div class="error"
             th:if="${#fields.hasErrors('*')}"
             th:text="'Проверьте правильность заполнения полей'">
        </div>
        <input type="hidden" th:field="*{id}">

        <div th:if="${#fields.hasErrors('*')}" class="error">
            <p th:each="err : ${#fields.errors('*')}"
               th:text="${err}"></p>
        </div>

        <label for="title">Название задачи *</label>
        <input type="text" id="title" th:field="*{title}"
               maxlength="150" required>

        <div class="error"
             th:if="${#fields.hasErrors('title')}"
             th:errors="*{title}"></div>

        <label for="description">Описание</label>
        <textarea id="description"
                  th:field="*{description}"
                  maxlength="1000"></textarea>

        <div class="error"
             th:if="${#fields.hasErrors('description')}"
             th:errors="*{description}"></div>

        <label for="dueDate">Срок выполнения</label>

        <input type="date"
               id="dueDate"
               th:field="*{dueDate}"
               th:attr="min=${minDate}">

        <div class="error"
             th:if="${#fields.hasErrors('dueDate')}"
             th:errors="*{dueDate}">
        </div>
        <div class="checkbox">
            <input type="checkbox" id="completed"
                   th:field="*{completed}">
            <label for="completed" style="display:inline">
                Задача выполнена
            </label>
        </div>

        <button class="button" type="submit">Сохранить</button>
        <a class="button secondary" th:href="@{/tasks}">
            Отмена
        </a>
    </form>
</div>
</body>
</html>
